# Atualizações de dependências agrupadas, uma vez por semana. Cada PR passa pelo CI completo
# (testes, E2E, auditoria). O pnpm continua aplicando a idade mínima de publicação.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    # Tauri 3 ainda é alpha (docs/roadmap.md, Riscos): só atualizações dentro da 2.x.
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    # TypeScript 7 quebra o typescript-eslint 8 e Tauri 3 ainda é alpha (docs/roadmap.md, Riscos):
    # essas trocas de versão maior são feitas à mão, quando houver suporte.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
