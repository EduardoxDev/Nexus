name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Gerar instalador NSIS (não assinado)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev build-essential
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testes (inclui verificação dos contratos TypeScript gerados)
        run: cargo test --workspace --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Site (tipos, testes e build pré-renderizado)
        working-directory: .
        run: |
          pnpm --filter @nexus/web typecheck
          pnpm --filter @nexus/web test
          pnpm --filter @nexus/web build
      - name: Bot do Discord (tipos e testes; o teste com a CLI real roda no job E2E)
        working-directory: .
        run: |
          pnpm --filter @nexus/discord-bot typecheck
          pnpm --filter @nexus/discord-bot test

  audit:
    name: Cadeia de suprimentos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: cargo deny (RustSec, licenças, origens; ver deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - name: pnpm audit
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod

  e2e-windows:
    name: E2E (WebView2)
    runs-on: windows-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Executável de teste (frontend embutido)
        working-directory: apps/desktop
        run: pnpm e2e:build
      - name: Playwright via CDP
        working-directory: apps/desktop
        run: pnpm e2e
      - name: Bot do Discord contra a CLI real
        run: pnpm --filter @nexus/discord-bot test
      - name: Artefatos de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          retention-days: 7

  bundle:
    name: Instalador NSIS (não assinado)
    if: github.event_name == 'workflow_dispatch' && inputs.bundle
    runs-on: windows-latest
    needs: [e2e-windows]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Instalador com a CLI embutida
        shell: pwsh
        run: ./scripts/release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: nexus-windows-nsis-unsigned
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
