name: Release

# Uma tag v* gera o instalador (com a CLI embutida) num ambiente limpo e abre um rascunho de
# release com o instalador e o SHA256SUMS. Nada é publicado sem revisão manual do rascunho.
# Assinatura de código: pendente (ver docs/release.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Instalador Windows (não assinado)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - name: Testes antes de empacotar
        run: cargo test --workspace --locked
      - name: Instalador com a CLI embutida
        shell: pwsh
        run: ./scripts/release.ps1
      - name: SHA256SUMS
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/nsis/*.exe
          $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii target/release/bundle/nsis/SHA256SUMS.txt
          Get-Content target/release/bundle/nsis/SHA256SUMS.txt
      - name: Rascunho de release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" --draft --verify-tag `
            --title "NEXUS ${{ github.ref_name }}" `
            --notes "Instalador **não assinado** (o SmartScreen pode alertar). Confira o SHA-256 em SHA256SUMS.txt." `
            target/release/bundle/nsis/*.exe target/release/bundle/nsis/SHA256SUMS.txt
