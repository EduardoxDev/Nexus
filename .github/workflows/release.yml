name: Release

# Uma tag v* gera os pacotes (com a CLI embutida) em ambientes limpos e abre um rascunho de
# release com todos eles e o SHA256SUMS. Nada é publicado sem revisão manual do rascunho.
# Assinatura de código: pendente (ver docs/release.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Pacotes ${{ matrix.name }} (não assinados)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, arch: x64, test: true }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: x64, test: true }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, arch: aarch64, test: true }
          # Compilado no runner Apple Silicon; os testes já rodaram no job acima.
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, arch: x64, test: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev build-essential patchelf file
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Toolchain (rust-toolchain.toml) e alvo
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Testes antes de empacotar
        if: matrix.test
        run: cargo test --workspace --locked
      - name: Pacotes com a CLI embutida (inclui a fumaça da CLI e as assinaturas do atualizador)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release.ps1 -Target ${{ matrix.target }}
      - name: O .deb leva a CLI
        if: runner.os == 'Linux'
        run: dpkg-deb -c target/${{ matrix.target }}/release/bundle/deb/*.deb | grep -E 'usr/bin/nexus$'
      - name: Separar os pacotes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $bundle = "target/${{ matrix.target }}/release/bundle"
          Get-ChildItem $bundle -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".deb", ".AppImage", ".dmg" -or $_.Name -match '\.(exe|AppImage)\.sig$' } |
            Copy-Item -Destination out
          # macOS: o pacote do atualizador tem o mesmo nome nas duas arquiteturas; leva a arquitetura.
          foreach ($f in Get-ChildItem "$bundle/macos" -Filter "*.app.tar.gz*" -File -ErrorAction SilentlyContinue) {
            Copy-Item $f.FullName (Join-Path out ($f.Name -replace '\.app\.tar\.gz', '_${{ matrix.arch }}.app.tar.gz'))
          }
          Get-ChildItem out
      - uses: actions/upload-artifact@v7
        with:
          name: nexus-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Rascunho de release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: latest.json (atualizador)
        run: node scripts/latest-json.mjs out "${{ github.ref_name }}" "${{ github.repository }}"
      - name: SHA256SUMS
        working-directory: out
        run: |
          sha256sum $(ls | grep -v '\.sig$') > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Criar o rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --verify-tag \
            --title "NEXUS ${{ github.ref_name }}" \
            --notes "Pacotes **não assinados**: no Windows o SmartScreen pode alertar; no macOS, veja docs/release.md para abrir o app. Confira o SHA-256 em SHA256SUMS.txt." \
            out/*
