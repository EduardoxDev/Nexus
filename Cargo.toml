[workspace]
resolver = "3"
members = ["crates/nexus-core", "crates/nexus-mcp", "crates/nexus-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/nexus-context/nexus"
authors = ["NEXUS contributors"]

[workspace.dependencies]
nexus-core = { path = "crates/nexus-core" }
nexus-mcp = { path = "crates/nexus-mcp" }

rusqlite = { version = "0.40", features = ["bundled", "backup"] }
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
uuid = { version = "1.28", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "macros"] }
dirs = "7"
ts-rs = { version = "12", features = ["serde-json-impl"] }
ignore = "0.4.33"
rayon = "1.12"
regex = "1.13"
dunce = "1.0"
notify = "8.2"
notify-debouncer-full = "0.7"
clap = { version = "4.6", features = ["derive"] }

tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-window-state = "2.5"
# 2.x fixado: a 3.0 alpha aparece como latest (ver docs/roadmap.md, Riscos).
tauri-plugin-updater = "2.13"

tempfile = "3.27"
assert_cmd = "2.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
