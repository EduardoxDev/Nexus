# cargo-deny: vulnerabilidades (RustSec), licenças, crates proibidos e origens.
# Roda no CI (job "Cadeia de suprimentos"). Localmente: `cargo deny check`.

[advisories]
# Avisos ignorados precisam de justificativa e data de revisão.
ignore = []

[licenses]
confidence-threshold = 0.9
# Lista levantada do Cargo.lock em 2026-10-12. MPL-2.0 (copyleft por arquivo) aparece em
# cssparser/selectors (via Tauri) e option-ext (via dirs), usados sem modificação.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "allow"
# Dependências do próprio workspace são por caminho; o resto vem com versão do Cargo.lock.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
