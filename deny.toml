# cargo-deny: vulnerabilidades (RustSec), licenças, crates proibidos e origens.
# Roda no CI (job "Cadeia de suprimentos"). Localmente: `cargo deny check`.

[advisories]
# Avisos ignorados precisam de justificativa e data de revisão.
ignore = [
  # proc-macro-error 1.0.4 sem manutenção: entra só por glib-macros -> gtk (Tauri no Linux).
  # Macro de compilação, não vai para o instalador Windows; some quando o Tauri trocar o gtk-rs.
  # Revisar em 2027-01-13.
  { id = "RUSTSEC-2024-0370", reason = "gtk-rs via Tauri, só Linux, sem versão corrigida" },
]

[licenses]
confidence-threshold = 0.9
# Lista levantada do Cargo.lock em 2026-10-12. MPL-2.0 (copyleft por arquivo) aparece em
# cssparser/selectors (via Tauri) e option-ext (via dirs), usados sem modificação.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]
# CDLA-Permissive-2.0 (licença permissiva de dados): a lista de autoridades certificadoras da
# Mozilla em webpki-root-certs, que chega pelo HTTPS do atualizador (reqwest/rustls). Liberada só
# para esse pacote.
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "allow"
# Dependências do próprio workspace são por caminho; o resto vem com versão do Cargo.lock.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
